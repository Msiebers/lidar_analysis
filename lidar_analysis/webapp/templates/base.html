<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Experiment configuration editor{% endblock %}</title>
  <style>
    :root { --fg: #1d2329; --muted: #5b6670; --line: #d4dae0; --bg: #ffffff; --panel: #f5f7f9;
            --accent: #1f5f99; --error: #a3201b; --error-bg: #fdf0ef; --ok: #1f6b3a; --ok-bg: #eef7f1; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--fg); background: var(--bg); }
    header { border-bottom: 1px solid var(--line); background: var(--panel); }
    header .inner, main { max-width: 960px; margin: 0 auto; padding: 0 16px; }
    header .inner { display: flex; gap: 16px; align-items: baseline; padding-top: 12px; padding-bottom: 12px; flex-wrap: wrap; }
    header a { color: var(--fg); text-decoration: none; font-weight: 600; }
    header .doc { color: var(--muted); font-size: 14px; }
    main { padding-top: 24px; padding-bottom: 48px; }
    h1 { font-size: 22px; margin: 0 0 16px; }
    h2 { font-size: 18px; margin: 28px 0 8px; }
    section.card { border: 1px solid var(--line); border-radius: 6px; padding: 16px; margin-bottom: 20px; }
    label { display: block; font-weight: 600; margin-bottom: 4px; }
    input[type=text], select { width: 100%; max-width: 520px; padding: 6px 8px; font: inherit; border: 1px solid var(--line); border-radius: 4px; }
    input[aria-invalid=true], select[aria-invalid=true] { border-color: var(--error); }
    button { font: inherit; padding: 6px 14px; border: 1px solid var(--accent); background: var(--accent); color: #fff; border-radius: 4px; cursor: pointer; margin-top: 8px; }
    button.secondary { background: #fff; color: var(--accent); }
    :focus-visible { outline: 3px solid #f2b705; outline-offset: 2px; }
    .hint, .muted { color: var(--muted); font-size: 14px; }
    .message { padding: 10px 12px; border-radius: 4px; margin: 8px 0 16px; }
    .message.error { background: var(--error-bg); color: var(--error); border: 1px solid var(--error); }
    .message.ok { background: var(--ok-bg); color: var(--ok); border: 1px solid var(--ok); }
    .field-error { color: var(--error); font-size: 14px; margin-top: 4px; }
    .field { margin: 14px 0; }
    .note { font-size: 14px; margin-top: 4px; padding: 4px 8px; border-left: 3px solid #c58a00; background: #fff8e6; }
    .locked-label { font-weight: 600; }
    .badge { font-size: 12px; font-weight: 600; padding: 1px 6px; border: 1px solid var(--muted); border-radius: 10px; color: var(--muted); }
    details { margin-top: 12px; border-top: 1px dashed var(--line); padding-top: 8px; }
    summary { cursor: pointer; font-weight: 600; }
    .actions { margin: 8px 0 16px; }
    dt { margin-top: 8px; }
    h3 { font-size: 16px; margin: 0 0 6px; }
    .op { border-top: 1px solid var(--line); padding: 14px 0; }
    .add-op { border-top: 1px solid var(--line); padding-top: 14px; }
    code, .path { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <header>
    <div class="inner">
      <a href="/">Experiment configuration editor</a>
      {% if current_document is not none %}
        <span class="doc">Open: <a href="/editor">{{ current_document.experiment_name or "(unnamed)" }}</a></span>
      {% endif %}
    </div>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
