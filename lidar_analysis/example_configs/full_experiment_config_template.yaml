experiment_name: example_experiment
processing_mode: local
processing:
  # null = sequential/off; set 2 or 4 to process that many scans concurrently.
  parallel_scans: null
config_reviewed: false
config_note: Full reusable experiment config template. Copy and edit for a real run.

analysis:
  # Window splitting
  split_source: distance  # options: distance, marks

  # Marks define windows along the scan. The scan filename defines the biological target.
  marks:
    target_type: auto  # options: auto, plant, plot
    buffer_u: 0.0
    missing_file: error  # options: error, skip, distance
    empty_file: skip  # options: skip, error, distance
    free_marks_as: none  # options: none, plant, plot
    dirname: markers
    write_pointcloud: false  # options: true, false
    write_reference_points: false  # options: true, false
    write_window_pointcloud: false  # options: true, false

  # Force otherwise single-target field scan names into left/right derived outputs.
  # Only for reprocessing old single-target scans for side-aware FAD/LAI/MTA.
  # Normal two-sided scans should use & in the scan name, e.g. 1&2_7.
  # Does not apply to legacy scan_* additional scans; those use additional_scan_side_split.
  force_two_sided_targets: false  # options: true, false

  # Legacy scan_* additional scans only. Normal field scans should use & in the scan name
  # for natural two-sided outputs, or force_two_sided_targets only for old datasets.
  additional_scan_side_split: false  # options: true, false
  additional_scan_side_axis: x  # options: x
  additional_scan_positive_side_label: right
  additional_scan_negative_side_label: left

  # Dimensions / global masks
  dim_units: m # options ft (feet) or m (meters)
  row_width_u: 5.0
  start_u: 0.0
  split_u: 0.0
  end_buffer_u: 0.5
  n_plots: null
  x_min_u: null
  max_y_u: null
  min_radius_u: null

  # Outputs
  generate_pointclouds: true
  overwrite_pointclouds: true
  write_lidar_per_plot: true

  # Fusion / IMU
  fusion_method: interp  # options: interp, pps, imu_interp
  use_imu: false
  # BNO085 Euler degrees from Pico. Signs are mounting-specific; validate from
  # the physical ground plane, not left/right point-count equality.
  imu_zero_mode: dense_median  # options: dense_median, calibration
  imu_zero_fraction: 0.5
  use_heading: false
  heading_sign: 1.0
  roll_sign: -1.0
  pitch_sign: -1.0

  use_local_ground_filter: false
  local_ground_x_bin_m: 0.025
  local_ground_z_bin_m: 0.025
  local_ground_quantile: 0.10
  local_ground_min_points_per_xz_bin: 5
  min_height_agl_m: 0.05

  # RSSI normalization / filtering
  normalize_rssi: false
  rssi_norm_mode: percentile  # options: percentile, zscore
  rssi_norm_transform: sqrt  # options: none, sqrt, log/log1p, exp/exponential
  use_rssi_filter: false
  rssi_min: null
  rssi_max: null

  # Traits
  run_height: false
  run_lai: false
  run_mta: false
  mta_angle_bin_deg: 5.0
  mta_diagnostic: false
  run_fad: false
  run_pai: false

  # FAD settings
  fad_height_percentile: 99.0
  fad_x_near_m: 0.0
  fad_y_min_m: 0.03
  fad_height_buffer_m: 0.0
  fad_grubbs_alpha: 0.01
  fad_g_function: spherical
  fad_run_layers: false
  fad_layer_thickness_m: 0.10
  fad_include_layer_columns: true

  # Bounded gap/transmission PAI settings (independent of FAD)
  pai_g_function: spherical
  pai_g_value: 0.5
  pai_height_percentile: 99.0
  pai_grubbs_alpha: 0.01
  pai_y_min_m: 0.10
  pai_x_near_m: 0.0
  pai_height_buffer_m: 0.0
  pai_diagnostic: false
  pai_layer_thickness_m: 0.10
  pai_include_layer_columns: false

  # YAML-ordered point-cloud analysis operations.
  # Operations run in the order listed below.
  # Each operation is listed here but disabled by default.
  # Put voxel_count after any filters you want reflected in the count.
  # Side-aware FAD/topology validation: force_two_sided_targets can split old
  # single-target scan names into left/right outputs. Run topology_trait on those
  # already split targets. Do not also enable split_sides_for_single_plot unless
  # intentionally testing the old topology-internal side split.
  pointcloud_ops:
    - op: scalar_range_filter
      enabled: false  # options: true, false
      scalar: rssi_norm
      min: 0.0
      max: null

    - op: sor_filter
      enabled: false  # options: true, false
      mean_k: 12
      std_ratio: 2.0

    - op: bilateral_scalar_filter
      enabled: false  # options: true, false
      scalar: rssi_norm
      sigma_spatial: 0.03
      sigma_range: 2.5
      radius: 0.06
      min_neighbors: 1
      max_neighbors: 0
      replace_scalar: false  # options: true, false
      output_scalar: rssi_norm_bilateral

    - op: height_range_filter
      enabled: false  # options: true, false
      axis: Y  # options: X, Y, Z
      min_m: 0.05
      max_m: null

    - op: voxel_count
      enabled: false  # options: true, false
      voxel_size_m: 0.05

    - op: topology_trait
      enabled: false  # options: true, false
      min_persistence: 0.35
      z_bin_m: 0.05
      split_sides_for_single_plot: false  # options: true, false
      skip_whole_when_split: false  # options: true, false
      write_topology_objects: false  # options: true, false

    - op: slice_structure_trait
      enabled: false  # options: true, false
      slice_height_m: 0.05
      height_axis: Y  # options: X, Y, Z
      spread_axis: X  # options: X, Y, Z
      length_axis: Z  # options: X, Y, Z
      percentile_height: 50.0
      min_points_per_slice: 5
      clump_grid_m: 0.05
      clump_connectivity: 8  # options: 4, 8

    - op: canopy_volume_2p5d
      enabled: false  # options: true, false
      cell_size_m: 0.01
      height_percentile: 95.0

  # Optional backend config. pointcloud_ops currently support scipy only; leave null.
  pcl_backend: null
