# Internal test-preview configuration. This does not run the LiDAR pipeline.
experiment: MeadowFescue_2026
raw_experiment_root: /media/slim/raw_mirror/MeadowFescue_2026
analysis_experiment_root: /media/slim/analysis_results/MeadowFescue_2026
delivery_root: /home/slim/Documents/lidar_delivery_tests

# Only validated columns in the current canonical results.csv are permitted.
metrics:
  - points
  - point_density_m2
  - stand_topo_per_m

top_fraction: 0.15
include_ties: true
outlier_iqr_multiplier: 1.5

# Researcher-friendly PNGs use Matplotlib's noninteractive Agg backend.
generate_graphs: true
graph_dpi: 160

# Optional: build only these dates (quote each entry). Omit to include every date found.
# dates:
#   - "2026_05_14"
#   - "2026_05_28"

# Optional: choose exactly which graphs to build. Omit this section entirely to get
# every graph type for every metric above (the default, unchanged from V2A).
# Each entry needs a type, a metric (must be listed above), and a scope:
#   type: histogram  scope: date     -> per-date distribution histogram
#   type: ranking    scope: date     -> per-date top-fraction ranking chart
#   type: boxplot    scope: summary  -> cross-date box plot in summary/growth/
# graphs:
#   - type: histogram
#     metric: point_density_m2
#     scope: date
#   - type: boxplot
#     metric: point_density_m2
#     scope: summary
