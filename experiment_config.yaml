experiment_name: test
processing_mode: local
processing:
  # null = sequential/off; set a positive integer for whole-scan worker processes.
  parallel_scans: null
config_reviewed: true
config_note: "LAI and MTA test using capped LiDAR LAI."

analysis:
  # Splitting
  split_source: distance
  mark_target_type: plant
  mark_z_buffer_u: 2.0
  missing_mark_file: error
  empty_mark_file: skip
  free_marks_as: none
  markers_dirname: markers
  
  # Dimensions / global masks
  dim_units: ft
  row_width_u: 2
  start_u: 5.0
  split_u: 8.0
  end_buffer_u: 0 
  n_plots: null
  x_min_u: 0.6
  max_y_u: null
  min_radius_u: 0.1

  # Marker/debug outputs
  write_reference_points: false
  write_window_pointcloud: false
  write_marker_pointcloud: false

  # Outputs
  generate_pointclouds: true
  overwrite_pointclouds: true
  write_lidar_per_plot: false

  # Fusion / IMU
  fusion_method: pps
  apply_imu: true
  # BNO085 Euler degrees from Pico. Signs are mounting-specific; validate from
  # the physical ground plane, not left/right point-count equality.
  imu_zero_mode: dense_median
  imu_zero_fraction: 0.2
  use_heading: false
  heading_sign: 1.0
  roll_sign: 1.0
  pitch_sign: -1.0

  # Snapped square X-Z grid ground filter.
  use_local_ground_filter: true
  local_ground_x_bin_m: 0.025
  local_ground_z_bin_m: 0.025
  local_ground_quantile: 0.10
  local_ground_min_points_per_xz_bin: 5
  min_height_agl_m: 0.05

  # RSSI normalization
  normalize_rssi: true
  rssi_norm_mode: zscore
  rssi_norm_transform: sqrt
  use_rssi_filter: false
  rssi_min: null
  rssi_max: null

  # Traits
  run_height: false
  run_lai: false
  debug_lai_bounds: false
  run_mta: false
  mta_angle_bin_deg: 5.0
  mta_diagnostic: false
  run_fad: false
  run_pai: false

  # FAD settings are present but inactive because run_fad is false
  fad_height_percentile: 99.0
  # Near face of each side-specific FAD box, measured from the LiDAR centerline.
  fad_x_near_m: 0.0
  fad_y_min_m: 0.1
  fad_height_buffer_m: 0.0
  fad_grubbs_alpha: 0.01
  fad_g_function: spherical
  fad_run_layers: false
  fad_layer_thickness_m: 0.10
  fad_include_layer_columns: false

  # Bounded gap/transmission PAI settings (independent of FAD)
  pai_g_function: spherical
  pai_g_value: 0.5
  pai_height_percentile: 99.0
  pai_grubbs_alpha: 0.01
  pai_y_min_m: 0.10
  pai_x_near_m: 0.0
  pai_height_buffer_m: 0.0
  pai_diagnostic: false
  pai_layer_thickness_m: 0.10
  pai_include_layer_columns: false
  
  # Additional scans / side split
  # Force otherwise single-target field scan names into left/right derived outputs.
  # Only for reprocessing old single-target scans for side-aware FAD/LAI/MTA.
  # Normal two-sided scans should use & in the scan name, e.g. 1&2_7.
  # Does not apply to legacy scan_* additional scans; those use additional_scan_side_split.
  force_two_sided_targets: false
  additional_scan_side_split: false
  additional_scan_side_axis: x
  additional_scan_positive_side_label: right
  additional_scan_negative_side_label: left

  # YAML-ordered target-level ops
  
  pointcloud_ops:
    # A global-Y lower threshold can recreate side-dependent retention.
    - name: height_range_filter
      enabled: false
      axis: Y
      min_m: null
      max_m: 0.8
      
    - name: bilateral_scalar_filter
      enabled: true
      backend: scipy
      scalar: rssi_norm
      output_scalar: rssi_norm_bilateral
      replace_scalar: true
      spatial_sigma_m: 0.02
      scalar_sigma: 4.0
      
    - name: scalar_range_filter
      enabled: true
      scalar: rssi_norm
      min: 1.2
      max: 4.0
      
    - name: sor_filter
      enabled: true
      mean_k: 6
      stddev_mul_thresh: 1.0

    - name: topology_trait
      enabled: true
      min_persistence: 0.4
      z_bin_m: 0.01
      split_sides_for_single_plot: true
      two_row_mode: target_only
      write_topology_objects: true

    - name: voxel_count
      enabled: false
      voxel_size_m: 0.05

    - name: canopy_volume_2p5d
      enabled: false
      cell_size_m: 0.01
      height_percentile: 95.0

  pcl_backend:
    enabled: false
